<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Mini ERP + CRM</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">E</div>
          <div class="sidebar-brand-text">Mini<span>ERP</span></div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Navigation</div>
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="customers.html" class="nav-link active">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Customers</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="products.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
              <span>Products</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="inventory.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>Inventory</span>
            </a>
          </li>
          <li class="nav-item admin-only">
            <a href="users.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span>Users</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-widget">
          <div class="user-avatar" id="user-avatar-text">U</div>
          <div class="user-details">
            <div class="user-name" id="user-display-name">Loading...</div>
            <span class="user-role-badge" id="user-display-role">ROLE</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
          <h1 class="page-title-heading">Customers</h1>
        </div>
        <div class="navbar-right">
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </header>

      <main class="main-content">
        <!-- Page Header Title & Subtitle -->
        <div class="page-header-action">
          <div class="page-header-title">
            <h2>Customers</h2>
            <p>Manage customer records and business contacts.</p>
          </div>
          <button class="btn btn-primary" onclick="openAddCustomerModal()">
            Add Customer
          </button>
        </div>

        <!-- Toolbar -->
        <div class="action-bar">
          <div class="search-box">
            <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="customer-search-input" placeholder="Search by name, phone, email, or company..." onkeyup="if(event.key==='Enter') applyFilters()">
          </div>

          <div class="filter-group">
            <button class="btn btn-outline" onclick="applyFilters()">Search</button>
          </div>
        </div>

        <!-- Table Container Card -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Company</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>GST</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="customers-table-body">
                  <tr>
                    <td colspan="7" style="text-align:center; padding: 1.5rem;">
                      Loading customers list...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer">
            <div id="pagination-container" class="pagination-wrapper"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Customer Modal -->
  <div class="modal-backdrop" id="customer-modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="customer-modal-title">Add New Customer</h3>
        <button class="modal-close-btn" onclick="closeCustomerModal()">&times;</button>
      </div>
      <form id="customer-form" onsubmit="handleCustomerFormSubmit(event)">
        <input type="hidden" id="customer-id">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required" for="customer-name">Customer Name</label>
              <input type="text" id="customer-name" class="form-control" required placeholder="Full Name">
            </div>
            <div class="form-group">
              <label class="form-label required" for="customer-phone">Phone Number</label>
              <input type="text" id="customer-phone" class="form-control" required placeholder="e.g. +919876543210">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="customer-email">Email Address</label>
              <input type="email" id="customer-email" class="form-control" placeholder="contact@company.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="customer-company">Company Name</label>
              <input type="text" id="customer-company" class="form-control" placeholder="Apex Engineering">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="customer-gst">GST Number</label>
              <input type="text" id="customer-gst" class="form-control" placeholder="27ABCDE1234F1Z5">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="customer-address">Address</label>
            <textarea id="customer-address" rows="2" class="form-control" placeholder="Street address, city, state"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeCustomerModal()">Cancel</button>
          <button type="submit" id="btn-save-customer" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/customers.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }
  </script>
</body>
</html>
