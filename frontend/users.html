<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Mini ERP + CRM</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">E</div>
          <div class="sidebar-brand-text">Mini<span>ERP</span></div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Navigation</div>
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="customers.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Customers</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="products.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
              <span>Products</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="inventory.html" class="nav-link">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>Inventory</span>
            </a>
          </li>
          <li class="nav-item admin-only">
            <a href="users.html" class="nav-link active">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span>Users</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-widget">
          <div class="user-avatar" id="user-avatar-text">U</div>
          <div class="user-details">
            <div class="user-name" id="user-display-name">Loading...</div>
            <span class="user-role-badge" id="user-display-role">ROLE</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
          <h1 class="page-title-heading">Users & Roles</h1>
        </div>
        <div class="navbar-right">
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </header>

      <main class="main-content">
        <!-- Page Header -->
        <div class="page-header-action">
          <div class="page-header-title">
            <h2>Users & Roles</h2>
            <p>Manage system user accounts and assign RBAC permissions.</p>
          </div>
          <button class="btn btn-primary" onclick="openAddUserModal()">
            Add User
          </button>
        </div>

        <!-- Toolbar -->
        <div class="action-bar">
          <div class="search-box">
            <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="user-search-input" placeholder="Search user by name or email..." onkeyup="if(event.key==='Enter') applyFilters()">
          </div>

          <div class="filter-group">
            <select id="user-role-filter" class="form-select" style="width: auto; height:40px;" onchange="applyFilters()">
              <option value="">All Roles</option>
              <option value="ADMIN">Admin</option>
              <option value="SALES">Sales</option>
              <option value="WAREHOUSE">Warehouse</option>
              <option value="ACCOUNTS">Accounts</option>
            </select>

            <button class="btn btn-outline" onclick="applyFilters()">Filter</button>
          </div>
        </div>

        <!-- Users Table Card -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="users-tbody">
                  <tr>
                    <td colspan="5" style="text-align:center; padding: 1.5rem;">
                      Loading users list...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer">
            <div id="users-pagination" class="pagination-wrapper"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit User Modal -->
  <div class="modal-backdrop" id="user-modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="user-modal-title">Add New User</h3>
        <button class="modal-close-btn" onclick="closeUserModal()">&times;</button>
      </div>
      <form id="user-form" onsubmit="handleUserFormSubmit(event)">
        <input type="hidden" id="user-id">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label required" for="user-name">Full Name</label>
            <input type="text" id="user-name" class="form-control" required placeholder="User full name">
          </div>

          <div class="form-group">
            <label class="form-label required" for="user-email">Email Address</label>
            <input type="email" id="user-email" class="form-control" required placeholder="user@company.com">
          </div>

          <div class="form-group" id="password-group">
            <label class="form-label required" for="user-password">Password</label>
            <input type="password" id="user-password" class="form-control" placeholder="••••••••" minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label required" for="user-role">System Role (RBAC)</label>
            <select id="user-role" class="form-select" required>
              <option value="ADMIN">Admin (Full Control)</option>
              <option value="SALES">Sales Executive</option>
              <option value="WAREHOUSE">Warehouse Manager</option>
              <option value="ACCOUNTS">Accounts Officer</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
          <button type="submit" id="btn-save-user" class="btn btn-primary">Save User Account</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }
  </script>
</body>
</html>
