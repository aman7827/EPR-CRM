version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crm_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: crm_erp_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crm_erp_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: super_secret_jwt_access_key_change_in_production_32char
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: super_secret_jwt_refresh_key_change_in_production_32char
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"

volumes:
  postgres_data:
